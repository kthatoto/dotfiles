# terminal-bg 設定ファイル
# 各リポジトリの背景色・背景画像を定義

default:
  color: "#1d1e20"
  image: null

repos:
  rakushifu:
    color: "#1e1e3f"
    image: null
  rakushifu-a:
    color: "#1e1e3f"
    image: "~/dotfiles/scripts/terminal-bg/patterns/rakushifu-a.png"
