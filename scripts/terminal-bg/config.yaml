    color: "#1e1e3f"
    image: "~/dotfiles/scripts/terminal-bg/patterns/rakushifu-b.png"
  rakushifu-c:
    color: "#1e1e3f"
    image: "~/dotfiles/scripts/terminal-bg/patterns/rakushifu-c.png"
  communication:
    color: "#1e3f2f"
    image: null
  vibe-tree:
    color: "#3f1e2f"
    image: null
  xbit-common-app:
    color: "#1e3f1e"
    image: "~/dotfiles/scripts/terminal-bg/patterns/xbit-common-app.png"
  cloud-claude-code:
    color: "#3f2a1e"
    image: null
  accord:
    color: "#1e3f3f"
    image: null
  home:
    color: "#2f1e3f"
    image: null
  rakushifu-forcast-be:
    color: "#1e3f5f"
    image: null
  rakushifu-forcast-fe:
    color: "#1e3f5f"
